[package]
name = "aivo"
version = "0.49.6"
edition = "2024"
rust-version = "1.97"
authors = ["yuanchuan"]
description = "A lightweight CLI for managing API keys and running Claude Code, Codex, and Gemini CLI across providers"
license = "MIT"
repository = "https://github.com/yuanchuan/aivo"

[lib]
doctest = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"

[dependencies]
# CLI
# Help is hand-rolled (`print_help*`); clap's `usage`/`help`/`color`/`suggestions`
# stay off. `error-context` is required for InvalidSubcommand recovery.
clap = { version = "4.5", default-features = false, features = ["std", "derive", "error-context"] }
console = "0.15"
crossterm = "0.29"
# ratatui-crossterm defaults to 0.29. Enabling crossterm_0_28 alongside that
# compiled both majors plus a second rustix (0.38). Stay on 0.29 only.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
portable-pty = "0.9"

# HTTP
http = "1"
# Keep env/system proxy support on so Termux and proxy-backed networks match curl.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
# No `io-std`: stdin/stdout go through `std::io`, not tokio's async stdio.
tokio = { version = "1.43", features = ["rt", "macros", "process", "signal", "time", "fs", "net", "sync", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = { version = "0.12", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }

# Encryption
aes = "0.8"
aes-gcm = "0.10"
pbkdf2 = "0.12"
argon2 = "0.5"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
# Direct OS-CSPRNG access (src/services/rng.rs); already in-tree via rustls
# and the rand_core stack, so this links no additional code.
getrandom = "0.3"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
# Verify-only minisign: authenticates self-update downloads against an
# embedded public key (src/commands/update.rs). No signing on the client.
minisign-verify = "0.2.5"

# Image attachment normalization. Kept lean for the 10 MiB musl gate: zune-png
# over `png` (shares zune-core, skips the flate2/miniz stack), and the x86 SIMD
# fast paths off — decode is a once-per-attachment cost, size is the constraint.
zune-png = { version = "0.4", default-features = false, features = ["std"] }
zune-jpeg = { version = "0.4", default-features = false, features = ["std", "neon"] }
zune-core = "0.4"
jpeg-encoder = "0.6"
# Inflates build.rs-compressed assets; features mirror zune-png's dependency
# exactly so this links no additional code.
zune-inflate = { version = "0.2", default-features = false, features = ["zlib"] }

# Utils
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1.0"
shlex = "1.3"
unicode-width = "0.2"
tempfile = "3.0"
url = "2"
# Transitive pin: keeps url's idna in punycode-only mode, dropping the ICU4X
# unicode-table stack. Non-ASCII (IDN) hostnames must be pre-punycoded —
# provider API hosts are ASCII, so nothing user-facing changes.
idna_adapter = "~1.0"

# Termux DNS fallback; see src/services/dns_resolver.rs. aarch64-only: Termux
# devices are aarch64, and it keeps ~490 KB off the x86_64-musl size gate.
[target.'cfg(all(target_env = "musl", target_arch = "aarch64"))'.dependencies]
hickory-resolver = "0.26.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Copy-on-write file cloning (clonefile/FICLONE) for the fast sub-agent worktree
# path in agent::subagents; strict reflink so a non-CoW filesystem falls back to plain git.
reflink-copy = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-only filesystem write confinement for the agent's run_bash sandbox
# (src/agent/sandbox.rs). Pure-Rust, no C deps; degrades on pre-5.13 kernels.
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Directory junctions (no-privilege reparse points) for the codex/gemini/pi home
# shadows; plain symlinks need Developer Mode. See src/services/symlink_util.rs.
junction = "2"


[features]
# Test-only feature: reduces PBKDF2 iterations so the test suite runs fast.
# Double-underscore prefix signals "internal/private" — never enable from
# release builds or downstream crates. A runtime guard in
# main.rs::fast_crypto_guard refuses to run binaries built with this feature
# against real user config (override: AIVO_TEST_FAST_CRYPTO_OK=1).
__internal_test_fast_crypto = []

[build-dependencies]
miniz_oxide = "0.8"

[dev-dependencies]
ctor = "1.0.9"
# Test-only PNG *encoder* for image_optimize fixtures; decode ships zune-png.
png = "0.17"
tempfile = "3.0"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
debug = false

[profile.release]
opt-level = "s"     # Optimize for size
lto = true
strip = true
codegen-units = 1
panic = "abort"     # Remove unwinding code
